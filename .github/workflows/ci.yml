name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# A newer push to the same branch cancels the older, still-running build.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android · build, unit tests, lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Matches the JDK the project builds on locally (Gradle runs on 21, code
      # still targets 17 via compileOptions).
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # google-services.json holds the real Firebase API key, so it's gitignored
      # and never reaches CI. The Google Services plugin only needs a structurally
      # valid file whose package_name matches the applicationId — a throwaway one
      # is enough to compile and test. Release builds should inject the real file
      # from a secret instead.
      - name: Write placeholder google-services.json
        run: |
          echo '{"project_info":{"project_number":"000000000000","project_id":"demo-duren-ci","storage_bucket":"demo-duren-ci.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000","android_client_info":{"package_name":"com.duren"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyDUMMYCIKEYDONOTUSExxxxxxxxxxxxxxx"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > app/google-services.json

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests + assemble debug
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace

      # Lint runs but doesn't fail the build yet — the report is uploaded so we can
      # burn the warnings down over time and flip this to blocking later.
      - name: Android Lint
        run: ./gradlew :app:lintDebug --continue || true

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: duren-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  firestore-rules:
    name: Firestore · security rules
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The Firestore emulator is a Java process.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Install rules-test dependencies
        run: npm install --prefix firebase/test

      # emulators:exec reads firebase.json at the repo root, boots the Firestore
      # emulator, runs the mocha suite against it, then tears it down. A demo-*
      # project id keeps it fully offline (no credentials needed).
      - name: Run security-rules tests
        run: firebase emulators:exec --only firestore --project demo-duren-ci "cd firebase/test && npm test"
